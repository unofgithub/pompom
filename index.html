<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f4f6f1;
      color: #2d3a2e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      gap: 32px;
      padding: 24px;
    }

    #timeDisplay {
      font-size: clamp(44px, 11vw, 72px);
      font-weight: 200;
      letter-spacing: 0.08em;
      color: #2d3a2e;
      font-variant-numeric: tabular-nums;
    }

    canvas {
      display: block;
      /* CSS size — buffer is scaled by dpr in JS */
      touch-action: none;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time-input {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    input[type="number"] {
      background: #fff;
      border: 1.5px solid #c8d8c9;
      color: #2d3a2e;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 18px;
      width: 70px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus { border-color: #4caf6e; }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { opacity: 0.4; }

    span.unit {
      font-size: 13px;
      color: #8aaa8c;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    button {
      border: none;
      padding: 11px 28px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.02em;
    }

    button:active { transform: scale(0.97); }

    #startBtn {
      background: #4caf6e;
      color: #fff;
      min-width: 90px;
    }

    #resetBtn {
      background: #fff;
      color: #8aaa8c;
      border: 1.5px solid #c8d8c9;
    }

    button:hover { opacity: 0.82; }

    #fsBtn {
      position: fixed;
      top: 14px;
      right: 14px;
      background: none;
      border: none;
      padding: 6px;
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.2s;
      line-height: 0;
    }

    #fsBtn:hover { opacity: 0.8; }

    .duration-btns {
      display: flex;
      gap: 8px;
    }

    .dur {
      background: #fff;
      color: #4a6e4c;
      border: 1.5px solid #c8d8c9;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }

    .dur:active { transform: scale(0.96); }

    .dur.active {
      background: #4caf6e;
      color: #fff;
      border-color: #4caf6e;
    }
  </style>
</head>
<body>

<button id="fsBtn" onclick="toggleFS()" title="Fullscreen">
  <svg id="fsIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2d3a2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
    <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
  </svg>
</button>

<div id="timeDisplay">25:00</div>
<canvas id="c"></canvas>
<div class="duration-btns">
  <button class="dur"        onclick="setDurationSecs(5, this)">5s</button>
  <button class="dur active" onclick="setDuration(25, this)">25m</button>
  <button class="dur"        onclick="setDuration(30, this)">30m</button>
  <button class="dur"        onclick="setDuration(45, this)">45m</button>
  <button class="dur"        onclick="setDuration(60, this)">1h</button>
</div>
<div class="controls">
  <button id="startBtn" onclick="toggle()">Start</button>
  <button id="resetBtn" onclick="reset()">Reset</button>
</div>

<script>
  const canvas      = document.getElementById('c');
  const ctx         = canvas.getContext('2d');
  const startBtn    = document.getElementById('startBtn');
  const timeDisplay = document.getElementById('timeDisplay');

  // Colors
  const C_BG        = '#f4f6f1';   // body bg (center hole)
  const C_TRACK     = '#e2ece3';   // consumed portion
  const C_FILL      = '#4caf6e';   // remaining portion
  const C_TICK_MAJ  = '#3a5c3c';
  const C_TICK_MIN  = '#b0ccb2';
  const C_BORDER    = '#c8d8c9';
  const C_CENTER    = '#4caf6e';

  const HOUR = 3600; // whole pie = 1 hour

  let total     = 25 * 60;
  let remaining = total;
  let running   = false;
  let lastTs    = null;
  let rafId     = null;
  let tickId    = null;   // setInterval for background ticking
  let endTime   = null;   // absolute Date.now() deadline

  // ── sizing ────────────────────────────────────────────────────────────────

  function size() {
    const css = Math.round(Math.min(320, window.innerWidth * 0.75, window.innerHeight * 0.50));
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width  = css + 'px';
    canvas.style.height = css + 'px';
    canvas.width  = Math.round(css * dpr);
    canvas.height = Math.round(css * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  // ── draw ──────────────────────────────────────────────────────────────────

  function draw() {
    const css = parseFloat(canvas.style.width) || 340;
    const W   = css;
    const cx  = W / 2, cy = W / 2;

    // radii
    const rOuter = W * 0.46;   // outer tick ring edge
    const rPie   = W * 0.39;   // pie / filled area
    const rHole  = W * 0.13;   // center dot hole

    ctx.clearRect(0, 0, W, W);

    // ── 1. Consumed (track) full circle ──
    ctx.beginPath();
    ctx.arc(cx, cy, rPie, 0, Math.PI * 2);
    ctx.fillStyle = C_TRACK;
    ctx.fill();

    // ── 2. Remaining green pie — shrinks clockwise from top ──
    //    elapsed eats from 12 o'clock going CW; remaining is the trailing portion
    const remainingFrac   = Math.min(remaining / HOUR, 1);
    const pieStart        = -Math.PI / 2;                                  // always 12 o'clock
    const pieEnd          = -Math.PI / 2 + remainingFrac * Math.PI * 2;   // shrinks CCW

    if (remaining > 0.5) {
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, rPie, pieStart, pieEnd);
      ctx.closePath();
      ctx.fillStyle = C_FILL;
      ctx.fill();
    }

    // ── 3. Thin outer ring border ──
    ctx.beginPath();
    ctx.arc(cx, cy, rOuter, 0, Math.PI * 2);
    ctx.strokeStyle = C_BORDER;
    ctx.lineWidth = 1;
    ctx.stroke();

    // ── 4. Tick marks (between rPie and rOuter) ──
    for (let i = 0; i < 60; i++) {
      const angle   = (i / 60) * Math.PI * 2 - Math.PI / 2;
      const isMaj   = i % 5 === 0;
      const tickIn  = rPie   + (isMaj ? 3 : 5);
      const tickOut = rOuter - (isMaj ? 3 : 6);

      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(angle) * tickIn,  cy + Math.sin(angle) * tickIn);
      ctx.lineTo(cx + Math.cos(angle) * tickOut, cy + Math.sin(angle) * tickOut);
      ctx.strokeStyle = isMaj ? C_TICK_MAJ : C_TICK_MIN;
      ctx.lineWidth   = isMaj ? 1.8 : 1;
      ctx.stroke();
    }

    // ── 5. Center dot ──
    ctx.beginPath();
    ctx.arc(cx, cy, rHole, 0, Math.PI * 2);
    ctx.fillStyle = C_BG;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx, cy, rHole * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = C_CENTER;
    ctx.fill();

    // ── 5b. Knob on the green arc tip (only when not running) ──
    if (!running) {
      const totalFrac = Math.min(total / HOUR, 1);
      const knobAngle = -Math.PI / 2 + totalFrac * Math.PI * 2;
      const knobR     = (rPie + rOuter) / 2;
      const kx        = cx + Math.cos(knobAngle) * knobR;
      const ky        = cy + Math.sin(knobAngle) * knobR;
      const kr        = W * 0.055;
      // shadow
      ctx.save();
      ctx.shadowColor   = 'rgba(0,0,0,0.18)';
      ctx.shadowBlur    = 6;
      ctx.shadowOffsetY = 2;
      ctx.beginPath();
      ctx.arc(kx, ky, kr, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.restore();
      // border ring
      ctx.beginPath();
      ctx.arc(kx, ky, kr, 0, Math.PI * 2);
      ctx.strokeStyle = '#4caf6e';
      ctx.lineWidth   = 2.5;
      ctx.stroke();
      // inner dot
      ctx.beginPath();
      ctx.arc(kx, ky, kr * 0.32, 0, Math.PI * 2);
      ctx.fillStyle = '#4caf6e';
      ctx.fill();
    }

    // ── 6. Update time label ──
    const m = Math.floor(remaining / 60);
    const s = Math.floor(remaining % 60);
    timeDisplay.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  // ── timer loop ────────────────────────────────────────────────────────────
  // rAF drives smooth visuals when the tab is focused.
  // setInterval (1 s) keeps ticking in the background so beep() fires
  // even if the user switches tabs. Both derive remaining from an
  // absolute end-time so they always agree.

  function tick() {
    if (!running) return;
    remaining = Math.max(0, (endTime - Date.now()) / 1000);
    draw();
    if (remaining <= 0) { finish(); return; }
  }

  function step() {
    if (!running) return;
    tick();
    if (running) rafId = requestAnimationFrame(step);
  }

  function finish() {
    running = false;
    clearInterval(tickId);
    cancelAnimationFrame(rafId);
    tickId = null;
    remaining = total;
    startBtn.textContent = 'Start';
    draw();
    beep();
  }

  function startTimer() {
    endTime = Date.now() + remaining * 1000;
    running = true;
    startBtn.textContent = 'Pause';
    tickId = setInterval(tick, 1000);
    rafId  = requestAnimationFrame(step);
  }

  function stopTimer() {
    running = false;
    remaining = Math.max(0, (endTime - Date.now()) / 1000);
    clearInterval(tickId);
    cancelAnimationFrame(rafId);
    tickId = null;
    startBtn.textContent = 'Start';
    draw();
  }

  function toggle() {
    if (remaining <= 0) return;
    if (running) { stopTimer(); } else { startTimer(); }
  }

  function stopAndReset(newTotal) {
    running = false;
    clearInterval(tickId);
    cancelAnimationFrame(rafId);
    tickId    = null;
    total     = newTotal;
    remaining = total;
    startBtn.textContent = 'Start';
    draw();
  }

  function setDurationSecs(secs, btn) {
    document.querySelectorAll('.dur').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    stopAndReset(secs);
  }

  function setDuration(mins, btn) {
    document.querySelectorAll('.dur').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    stopAndReset(mins * 60);
  }

  function reset() {
    stopAndReset(total);
  }

  // ── knob drag ─────────────────────────────────────────────────────────────

  let dragging = false;

  function knobHitTest(ex, ey) {
    const rect  = canvas.getBoundingClientRect();
    const scale = parseFloat(canvas.style.width) / rect.width;
    const mx    = (ex - rect.left)  * scale;
    const my    = (ey - rect.top)   * scale;
    const css   = parseFloat(canvas.style.width);
    const cx    = css / 2, cy = css / 2;
    const rPie  = css * 0.39;
    const rOuter= css * 0.46;
    const knobR = (rPie + rOuter) / 2;
    const totalFrac  = Math.min(total / HOUR, 1);
    const knobAngle  = -Math.PI / 2 + totalFrac * Math.PI * 2;
    const kx   = cx + Math.cos(knobAngle) * knobR;
    const ky   = cy + Math.sin(knobAngle) * knobR;
    const kr   = css * 0.055;
    return Math.hypot(mx - kx, my - ky) <= kr * 1.5;
  }

  function angleToMinutes(ex, ey) {
    const rect  = canvas.getBoundingClientRect();
    const scale = parseFloat(canvas.style.width) / rect.width;
    const mx    = (ex - rect.left)  * scale;
    const my    = (ey - rect.top)   * scale;
    const css   = parseFloat(canvas.style.width);
    const cx    = css / 2, cy = css / 2;
    let angle   = Math.atan2(my - cy, mx - cx) + Math.PI / 2; // 0 at top
    if (angle < 0) angle += Math.PI * 2;
    const frac  = angle / (Math.PI * 2);
    return Math.max(1, Math.min(60, Math.round(frac * 60)));
  }

  function applyKnobMinutes(mins) {
    // deactivate preset buttons since we're using a custom value
    document.querySelectorAll('.dur').forEach(b => b.classList.remove('active'));
    total     = mins * 60;
    remaining = total;
    draw();
  }

  canvas.addEventListener('mousedown', e => {
    if (running) return;
    if (knobHitTest(e.clientX, e.clientY)) { dragging = true; canvas.style.cursor = 'grabbing'; }
  });
  canvas.addEventListener('mousemove', e => {
    if (running || dragging) { canvas.style.cursor = 'default'; return; }
    canvas.style.cursor = knobHitTest(e.clientX, e.clientY) ? 'grab' : 'default';
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    applyKnobMinutes(angleToMinutes(e.clientX, e.clientY));
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    canvas.style.cursor = 'default';
  });

  canvas.addEventListener('touchstart', e => {
    if (running) return;
    const t = e.touches[0];
    if (knobHitTest(t.clientX, t.clientY)) { dragging = true; e.preventDefault(); }
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    if (!dragging) return;
    e.preventDefault();
    const t = e.touches[0];
    applyKnobMinutes(angleToMinutes(t.clientX, t.clientY));
  }, { passive: false });
  canvas.addEventListener('touchend', () => { dragging = false; });

  // ── audio (HTML Audio element — works in background tabs) ──────────────
  // Pre-render the beep to a WAV blob via OfflineAudioContext, then play
  // it through an <audio> element. Browsers (including Brave) allow a
  // primed <audio> element to play in background tabs, unlike live
  // AudioContext oscillators which get suspended.

  let beepUrl = null;
  const beepAudio = new Audio();

  (function renderBeepToWav() {
    const sampleRate = 44100;
    const duration   = 0.85;
    const offline    = new OfflineAudioContext(1, Math.ceil(sampleRate * duration), sampleRate);

    const notes = [
      { freq: 523.25,  start: 0.00, dur: 0.10 },  // C5
      { freq: 659.25,  start: 0.09, dur: 0.10 },  // E5
      { freq: 783.99,  start: 0.18, dur: 0.10 },  // G5
      { freq: 1046.5,  start: 0.27, dur: 0.55 },  // C6 (held)
      { freq: 1318.5,  start: 0.30, dur: 0.50 },  // E6 (chord layer)
      { freq: 1567.98, start: 0.33, dur: 0.45 },  // G6 (chord layer)
    ];

    notes.forEach(({ freq, start, dur }) => {
      const osc  = offline.createOscillator();
      const gain = offline.createGain();
      osc.connect(gain);
      gain.connect(offline.destination);
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0, start);
      gain.gain.linearRampToValueAtTime(0.22, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
      osc.start(start);
      osc.stop(start + dur);
    });

    offline.startRendering().then(buffer => {
      // Encode to WAV
      const numFrames  = buffer.length;
      const numChannels = 1;
      const bytesPerSample = 2;
      const dataSize   = numFrames * numChannels * bytesPerSample;
      const wavBuffer  = new ArrayBuffer(44 + dataSize);
      const view       = new DataView(wavBuffer);

      function writeStr(offset, str) {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      }
      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * numChannels * bytesPerSample, true);
      view.setUint16(32, numChannels * bytesPerSample, true);
      view.setUint16(34, bytesPerSample * 8, true);
      writeStr(36, 'data');
      view.setUint32(40, dataSize, true);

      const samples = buffer.getChannelData(0);
      let offset = 44;
      for (let i = 0; i < numFrames; i++) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s * 0x7FFF, true);
        offset += 2;
      }

      beepUrl = URL.createObjectURL(new Blob([wavBuffer], { type: 'audio/wav' }));
      beepAudio.src = beepUrl;
    });
  })();

  // Prime the <audio> element on first user gesture (muted play)
  function primeAudio() {
    beepAudio.muted = true;
    beepAudio.play().then(() => { beepAudio.pause(); beepAudio.muted = false; }).catch(() => {});
  }
  document.addEventListener('click',      primeAudio, { once: true });
  document.addEventListener('touchstart', primeAudio, { once: true });

  function beep() {
    // Play audio
    if (beepUrl) {
      beepAudio.currentTime = 0;
      beepAudio.muted = false;
      beepAudio.play().catch(() => {});
    }
    // Show notification (works even in background tabs)
    if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
      const t = total >= 60 ? (total / 60) + ' min' : total + 's';
      new Notification('Pomodoro', { body: t + ' is up!', icon: 'icon.svg' });
    }
  }

  function toggleFS() {
    const el = document.documentElement;
    if (!document.fullscreenElement) {
      (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen).call(el);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen).call(document);
    }
  }

  document.addEventListener('fullscreenchange', updateFsIcon);
  document.addEventListener('webkitfullscreenchange', updateFsIcon);

  function updateFsIcon() {
    const inFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    document.getElementById('fsIcon').innerHTML = inFs
      ? '<polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/>'
      : '<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>';
  }

  window.addEventListener('resize', size);

  if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
    Notification.requestPermission();
  }

  size();
</script>
</body>
</html>
